kind = "web"
previewPath = "/"
title = "KidzLearn AI"
version = "1.0.0"
id = "artifacts/kidzlearn"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25832

[services.development]
run = "pnpm --filter @workspace/kidzlearn run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kidzlearn", "run", "build" ]
publicDir = "artifacts/kidzlearn/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25832"
BASE_PATH = "/"
